<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div aria-live="polite">
    <p id="status"></p>
    <pre id="result"></pre>
  </div>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topics = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    const manual = "Не удалось подготовить подсказку. Разберите заявку вручную.";
    let latestRequest = 0;

    function clearResult() {
      latestRequest += 1;
      result.textContent = "";
      status.textContent = "";
    }

    message.addEventListener("input", clearResult);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult();
      const requestId = latestRequest;
      const text = message.value.trim();
      if (!text) {
        status.textContent = "Введите текст заявки.";
        return;
      }

      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(5_000),
        });
        const data = await reply.json();
        if (requestId !== latestRequest) return;
        if (reply.status === 400 && data?.status === "invalid_input") {
          status.textContent = "Введите текст заявки.";
        } else if (reply.ok && data?.status === "ready" && Object.hasOwn(topics, data.topic)
          && typeof data.draft === "string" && data.draft.trim()) {
          status.textContent = "Черновик готов. Проверьте его перед отправкой.";
          result.textContent = `Тема: ${topics[data.topic]}\nЧерновик: ${data.draft}`;
        } else {
          status.textContent = manual;
        }
      } catch {
        if (requestId === latestRequest) status.textContent = manual;
      }
    });
  </script>
</body>
</html>
